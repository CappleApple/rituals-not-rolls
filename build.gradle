plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}
version = mod_version
group = 'com.cappleapple.ritualsnotrolls'
base { archivesName = 'ritualsnotrolls' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = project.neo_version
    parchment { minecraftVersion = '1.21.1'; mappingsVersion = '2024.11.17' }
    runs {
        client { client(); gameDirectory = file('run-client') }
        server { server(); programArgument '--nogui' }
        smokeServer { server(); gameDirectory = file('run'); programArgument '--nogui'; systemProperty 'ritualsnotrolls.devFixture', 'true' }
        powerTooltipClient { client(); gameDirectory = file('run-client'); systemProperty 'ritualsnotrolls.powerTooltipSmoke', 'true'; programArguments.addAll '--username', 'RitualTester', '--width', '1280', '--height', '720' }
        viewerClient { client(); gameDirectory = file('run-client'); systemProperty 'ritualsnotrolls.viewerSmoke', 'true'; programArguments.addAll '--username', 'RitualTester', '--width', '1280', '--height', '720' }
        libraryClient { client(); gameDirectory = file('run-client'); systemProperty 'ritualsnotrolls.librarySmoke', 'true'; programArguments.addAll '--username', 'RitualTester', '--width', '1280', '--height', '720' }
        particlePaletteClient { client(); gameDirectory = file('run-client'); systemProperty 'ritualsnotrolls.particlePalette', 'true'; programArguments.addAll '--username', 'RitualTester', '--width', '1600', '--height', '900' }
        guideExamplesClient { client(); gameDirectory = file('run-client'); systemProperty 'ritualsnotrolls.captureGuideExamples', 'true'; programArguments.addAll '--username', 'RitualTester', '--width', '960', '--height', '540' }
        guideClient { client(); gameDirectory = file('run-client'); systemProperty 'ritualsnotrolls.guideSmoke', 'true'; programArguments.addAll '--username', 'RitualTester', '--width', '1280', '--height', '720' }
        clientSmoke { client(); gameDirectory = file('run-client'); systemProperty 'ritualsnotrolls.clientActionSmoke', 'true'; programArguments.addAll '--username', 'RitualTester', '--width', '1280', '--height', '720' }
        refinementServer { server(); gameDirectory = file('run-refinement-server'); programArgument '--nogui'; systemProperty 'ritualsnotrolls.refinementFixture', 'true' }
        refinementClient { client(); gameDirectory = file('run-refinement-client'); systemProperty 'ritualsnotrolls.refinementSmoke', 'true'; programArguments.addAll '--username', 'RitualTester', '--width', '1280', '--height', '720' }
        pedestalCompatServer { server(); gameDirectory = file('run-pedestal-compat'); programArgument '--nogui'; systemProperty 'ritualsnotrolls.pedestalCompatFixture', 'true' }
        definitionCompatServer { server(); gameDirectory = file('run-compat'); programArgument '--nogui'; systemProperty 'ritualsnotrolls.definitionCompatFixture', 'true' }
        migrationServer { server(); gameDirectory = file('run-migration'); programArgument '--nogui'; systemProperty 'ritualsnotrolls.migrationFixture', 'true' }
        sableGameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run-sable-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'ritualsnotrolls_sable'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'ritualsnotrolls'
        }
    }
    mods { ritualsnotrolls { sourceSet(sourceSets.main) } }
    unitTest { enable(); testedMod = mods.ritualsnotrolls }
}
repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://maven.ryanhcode.dev/releases' } }
        filter { includeGroup 'dev.ryanhcode.sable-companion' }
    }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.terraformersmc.com/releases' }
    maven { url = 'https://maven.shedaniel.me' }
    maven { url = 'https://maven.architectury.dev' }
}
dependencies {
    if (project.hasProperty('sableTestJar')) runtimeOnly files(project.property('sableTestJar'))
    if (project.hasProperty('sableTestMods')) runtimeOnly fileTree(dir: project.property('sableTestMods'), include: '*.jar')
    jarJar(implementation('dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:[1.6.0,2.0)')) {
        version { prefer '1.6.0' }
    }
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.21.0.247'
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.21.0.247'
    compileOnly 'dev.emi:emi-neoforge:1.1.24+1.21.1:api'
    compileOnly('me.shedaniel:RoughlyEnoughItems-neoforge:16.0.799') { transitive = false }
    compileOnly('me.shedaniel.cloth:basic-math:0.6.1') { transitive = false }
    compileOnly('dev.architectury:architectury-neoforge:13.0.8') { transitive = false }
    if (project.findProperty('recipeViewer') in ['jei', 'emi-jei']) runtimeOnly 'mezz.jei:jei-1.21.1-neoforge:19.21.0.247'
    if (project.findProperty('recipeViewer') in ['emi', 'emi-jei']) runtimeOnly 'dev.emi:emi-neoforge:1.1.24+1.21.1'
    if (project.findProperty('recipeViewer') == 'rei') {
        runtimeOnly('me.shedaniel:RoughlyEnoughItems-neoforge:16.0.799') { transitive = false }
        runtimeOnly 'me.shedaniel.cloth:cloth-config-neoforge:15.0.140'
        runtimeOnly 'dev.architectury:architectury-neoforge:13.0.8'
    }

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test', Test) { useJUnitPlatform() }
tasks.named('jar', Jar) {
    from('THIRD_PARTY_LICENSES') { into 'META-INF/licenses' }
    exclude 'com/cappleapple/ritualsnotrolls/gametest/**', 'data/ritualsnotrolls_sable/**'
    exclude 'data/ritualsnotrolls/structure/empty.nbt', 'data/ritualsnotrolls/structure/network.nbt'
}
def resourceVersion = project.version.toString()
tasks.named('processResources', ProcessResources) {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: resourceVersion }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.add('-Xlint:deprecation')
}
